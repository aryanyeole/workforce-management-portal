name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Recent successful runs: ~1m31s. This is generous headroom over that for
    # a cold cache / slow image pull, not a bound sized to the fast path --
    # the point is bounding the failure mode (a hung Testcontainer sitting for
    # the 360-minute default), not shaving time off the common case.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2/repository, keyed on pom.xml — actions/setup-java's
          # built-in Maven cache, not a separate action/plugin.
          cache: maven

      # Same command run locally (CLAUDE.md's own Commands section: `mvn verify`,
      # here via the wrapper) — build and the full Testcontainers-backed suite,
      # nothing skipped. Testcontainers needs the runner's Docker daemon, which
      # ubuntu-latest provides preinstalled and running; no extra setup step
      # is needed for that. Every Postgres container AbstractIntegrationTest
      # starts is wired up via Spring Boot's @ServiceConnection, which
      # overrides the datasource URL with whatever ephemeral host port
      # Testcontainers actually bound — application.yml's own
      # jdbc:postgresql://localhost:5433/wmp default is a dev-only fallback
      # never consulted by an IT that extends AbstractIntegrationTest, so
      # there's no fixed-port assumption for CI to trip over.
      - name: Build and run the full test suite
        run: ./mvnw clean verify

      # So a failure's actual test output is readable from the Actions run
      # itself, without reproducing it locally first.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 14
