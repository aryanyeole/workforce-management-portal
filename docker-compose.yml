services:
  db:
    image: postgres:16-alpine
    container_name: wmp-db
    environment:
      POSTGRES_DB: wmp
      POSTGRES_USER: wmp
      POSTGRES_PASSWORD: wmp_local_dev
    ports:
      - "5433:5432"
    volumes:
      - wmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wmp -d wmp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wmp_pgdata:
