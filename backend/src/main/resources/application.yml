spring:
  application:
    name: wmp
  datasource:
    url: jdbc:postgresql://localhost:5433/wmp
    username: ${DB_USER:wmp}
    password: ${DB_PASSWORD:wmp_local_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Deliberately above wmp.onboarding.document-storage.max-file-size, so
      # our own validation (a clean 400 ProblemDetail) fires first and this
      # is only an outer safety net.
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Publishes histogram buckets (not just client-computed percentiles)
      # so Prometheus/Grafana can compute p50/p95/p99 server-side via
      # histogram_quantile() — see observability/grafana/dashboards. Scoped
      # to the routes Phase 7/8 actually watch, not every meter.
      percentiles-histogram:
        http.server.requests: true
        approvals.requests: true
        payroll.submit.requests: true

logging:
  level:
    org.hibernate.SQL: INFO

wmp:
  jwt:
    secret: ${JWT_SECRET:DttNcmgSsJTwzVUoGMgKB6hlgOcUqw/vf80yESLduxfXB2yECCyuGf7tBwR3E1v6}
    access-token-ttl: PT30M
    refresh-token-ttl: P7D
    issuer: wmp
  onboarding:
    document-storage:
      base-path: ${WMP_DOCUMENT_STORAGE_PATH:./data/onboarding-documents}
      max-file-size: 10MB
      allowed-content-types: application/pdf,image/png,image/jpeg
  payroll:
    accrual:
      # Default: 2 AM daily — never fires mid-run in a short-lived test
      # JVM. Also trigger-able on demand via POST
      # /api/v1/payroll/accrual/run (see PayrollAccrualJob, Phase 8).
      cron: ${WMP_PAYROLL_ACCRUAL_CRON:0 0 2 * * *}