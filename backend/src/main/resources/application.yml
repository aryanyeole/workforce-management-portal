spring:
  application:
    name: wmp
  datasource:
    url: jdbc:postgresql://localhost:5433/wmp
    username: ${DB_USER:wmp}
    password: ${DB_PASSWORD:wmp_local_dev}
    hikari:
      # Phase 8 (docs/incidents/2026-08-payroll-500s.md): these were unset
      # (Hikari's own defaults) when the accrual-job leak was reproduced and
      # diagnosed. None of them would have prevented that incident — a
      # leaked connection is gone from the pool regardless of how big the
      # pool is or how long a caller waits for one — they bound its blast
      # radius and shorten time-to-detection instead. See the incident
      # doc's Fix section for the full reasoning behind each value.
      maximum-pool-size: 10
      connection-timeout: 5000
      leak-detection-threshold: 2000
      # Applied per pooled connection at creation time, not via container
      # config — see the incident doc's Fix section for why (container
      # config wouldn't reach the Testcontainers-spawned Postgres the ITs
      # run against, nor any other Postgres instance this app might one
      # day point at).
      connection-init-sql: "SET statement_timeout = 5000; SET idle_in_transaction_session_timeout = 60000;"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Deliberately above wmp.onboarding.document-storage.max-file-size, so
      # our own validation (a clean 400 ProblemDetail) fires first and this
      # is only an outer safety net.
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Publishes histogram buckets (not just client-computed percentiles)
      # so Prometheus/Grafana can compute p50/p95/p99 server-side via
      # histogram_quantile() — see observability/grafana/dashboards. Scoped
      # to the routes Phase 7/8 actually watch, not every meter.
      percentiles-histogram:
        http.server.requests: true
        approvals.requests: true
        payroll.submit.requests: true

logging:
  level:
    org.hibernate.SQL: INFO
  pattern:
    # Overrides only the level segment of Boot's default console pattern
    # (LOG_LEVEL_PATTERN) rather than respecifying the whole thing — the
    # documented, low-risk way to append one token without having to keep a
    # hand-copied version of Boot's own default pattern in sync across
    # upgrades. Applies unconditionally, including local `mvnw spring-boot:run`
    # (Task requirement: console stays human-readable there) — this is still
    # plain text, just with the correlation ID (blank via :- when unset,
    # e.g. before the first request in a fresh JVM) visible inline, which is
    # a readability improvement for a developer correlating their own
    # curl/Postman calls against console output, not a regression.
    level: "%5p [%X{correlationId:-}]"

wmp:
  jwt:
    secret: ${JWT_SECRET:DttNcmgSsJTwzVUoGMgKB6hlgOcUqw/vf80yESLduxfXB2yECCyuGf7tBwR3E1v6}
    access-token-ttl: PT30M
    refresh-token-ttl: P7D
    issuer: wmp
  rate-limit:
    login:
      # 5 attempts land immediately (a legitimate user mistyping a password
      # twice never notices this exists), then one recovers every 12
      # seconds. Disabled for the whole IT suite regardless of this default
      # — see AbstractIntegrationTest's own comment for why the pre-existing
      # "test" Spring profile alone wasn't the right switch for that.
      enabled: ${WMP_RATE_LIMIT_LOGIN_ENABLED:true}
      capacity: ${WMP_RATE_LIMIT_LOGIN_CAPACITY:5}
      refill-per-minute: ${WMP_RATE_LIMIT_LOGIN_REFILL_PER_MINUTE:5}
  onboarding:
    document-storage:
      base-path: ${WMP_DOCUMENT_STORAGE_PATH:./data/onboarding-documents}
      max-file-size: 10MB
      allowed-content-types: application/pdf,image/png,image/jpeg
  payroll:
    accrual:
      # Default: 2 AM daily — never fires mid-run in a short-lived test
      # JVM. Also trigger-able on demand via POST
      # /actuator/payroll-accrual (see PayrollAccrualJob/PayrollAccrualEndpoint,
      # Phase 8).
      cron: ${WMP_PAYROLL_ACCRUAL_CRON:0 0 2 * * *}

---
# "container", not "prod": this project has no distinct prod profile yet,
# and the axis this flips on (structured JSON console output) is genuinely
# orthogonal to "dev" -- dev governs DevDataSeeder and CorsConfig, and the
# compose-run backend activates both dev AND container together
# (SPRING_PROFILES_ACTIVE=dev,container in docker-compose.yml), since it
# wants the seeded accounts AND JSON logs at once. Gating this on "not dev"
# instead would have made the containerized backend log human-readable text
# purely because it also happens to run the dev profile for its seed data --
# two unrelated concerns fighting over one flag.
#
# logstash, not ecs or gelf (the other two Spring Boot ships without any new
# dependency): a flat JSON object per line -- easier to grep/eyeball directly
# for a project with no log-shipping backend actually configured, and any
# MDC entry (correlationId, the accrual job's own per-run ID) is included as
# a top-level field automatically, no further config needed.
spring:
  config:
    activate:
      on-profile: container
logging:
  structured:
    format:
      console: logstash